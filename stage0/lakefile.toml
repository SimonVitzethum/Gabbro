name = "stage0"
version = "0.1.0"
defaultTargets = ["Stage0", "stage0"]
# Stage 0 of self-hosting (`dokumente/PLAN-SELF-HOSTING.md` §2): the Lean runtime for the Gabbro subset S0.
# It shares the Mathlib checkout of `grammatik/` (no second clone) and builds `grammatik` in place.
packagesDir = "../grammatik/.lake/packages"
weakLeanArgs = ["-j2", "-M16384", "-DElab.async=true"]

[[require]]
name = "grammatik"
path = "../grammatik"

[[lean_lib]]
name = "Stage0"

[[lean_exe]]
name = "stage0"
root = "Stage0.Haupt"
