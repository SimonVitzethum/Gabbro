name = "grammatik"
version = "0.1.0"
defaultTargets = ["Grammatik"]
# Bound native compiler workers/heap. Raised 2026-10-17 (Simon: Lean may run with up to 16 GiB; the kernel
# check of `Parser/ElementTiefProben.lean` hit "excessive memory consumption" at 4 GiB).
# Weak arguments preserve build traces; they change resource use, not proofs.
weakLeanArgs = ["-j2", "-M16384", "-DElab.async=true"]

# Mathlib ALLOWED EVERYWHERE since 2026-10-08 (Simon: "mathlib darf ueberall genutzt werden").
# Pinned to the tag whose toolchain equals this project's (v4.33.1); precompiled oleans via
# `lake exe cache get` -- a source build is not part of any lane. NO import of `programmlogik`
# or `passlogik`: this project is about the GRAMMAR alone. Nothing here reads the checker,
# the emitter, or `Body.lean`.

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "Grammatik"

# The coverage driver of the program generator (`Gen/Abdeckung/Lauf.lean`): a native executable, so that the generator
# reaches sizes the interpreter cannot (`instrumente/pruefe-lean.py`, stage 6, and the measurement in PRUEFER.md section 11).
[[lean_exe]]
name = "gen-abdeckung"
root = "Grammatik.Gen.Abdeckung.Lauf"
