name = "core"
version = "0.1.0"
defaultTargets = ["Core"]
# The new Gabbro model (PERFECT-MODEL.md, owner 2026-11-23): built fresh, never importing `grammatik`.
# Resource bounds; maxHeartbeats 100000 forces fast proofs (owner, 2026-11-23; PERFECT-MODEL §6.8).
weakLeanArgs = ["-M4096", "-DElab.async=true", "-DmaxHeartbeats=100000"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Core"
# The package audit runs after the model imports are built and can use all 12 workers.
roots = []
globs = ["Core"]
weakLeanArgs = ["-j12", "-DmaxErrors=0"]
[[lean_lib]]
name = "CoreModules"
roots = []
globs = ["Core.+"]
weakLeanArgs = ["-j2"]
