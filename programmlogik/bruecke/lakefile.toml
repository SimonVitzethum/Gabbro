name = "bruecke"
packagesDir = "../../grammatik/.lake/packages"
weakLeanArgs = ["-DmaxHeartbeats=400000"]
version = "0.1.0"
defaultTargets = ["Bruecke"]

# GabbroV: the model's certificate of the unit Stage 0 compiles (`Bruecke/Zertifikat`) and the generator
# `gabbrov`, on the toolchain of `grammatik` (v4.35.0). Mathlib comes in only through `grammatik`; the
# packages are shared with `grammatik/.lake/packages` (as `stage0/`).

[[require]]
name = "grammatik"
path = "../../grammatik"

# GabbroV states the certificate of the unit Stage 0 compiles (`Bruecke/Zertifikat/Lauf.lean`, `gabbrov`).
[[require]]
name = "stage0"
path = "../../stage0"

[[lean_lib]]
name = "Bruecke"

# GabbroV's generator: `gabbrov MODULE FILE.gab OUTDIR` writes the Lean certificate modules of a unit.
[[lean_exe]]
name = "gabbrov"
root = "Bruecke.Vorlage.Haupt"
