name = "programmlogik"
version = "0.1.0"
defaultTargets = ["Gabbro"]
# Weak args keep build traces. Elab.async elaborates theorem bodies in parallel (2026-10-17).
weakLeanArgs = ["-j2", "-M16384", "-DElab.async=true"]

# Mathlib ALLOWED since 2026-09-10 (decision: the range arithmetic of the S4
# checker-parity fixes needs order lemmas no finite hand-proof should duplicate).
# Scope is NARROW on purpose: only `Gabbro/Sicherheit/*` may import Mathlib;
# `Body.lean`, the grammar and `passlogik` stay dependency-free, so no generated
# obligation and no other project inherits the dependency.
# Pinned to the tag whose toolchain is v4.35.0 (Mathlib allowed everywhere since 2026-10-08, same pin as grammatik), with precompiled
# oleans via `lake exe cache get` -- a source build is not part of any lane.

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Gabbro"
