<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Terminal: the README example compiles and exits 42; two broken variants are refused">
  <title>Stage 0 on the README example and two broken variants</title>
  <rect width="1000" height="330" rx="12" fill="#14181e"/>
  <rect width="1000" height="34" rx="12" fill="#232931"/>
  <rect y="22" width="1000" height="12" fill="#232931"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
  <text x="500" y="22" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#8b95a1">Gabbro/stage0 — stage0 = .lake/build/bin/stage0</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" xml:space="preserve">
    <text x="20" y="64"><tspan fill="#7ee2b0">$</tspan><tspan fill="#e6e9ee"> stage0 --ir proben-ir/readme-counter.gab ok.img &amp;&amp; .lake/ir/runner ok.img; echo $?</tspan></text>
    <text x="20" y="85" fill="#e6e9ee">42</text>
    <text x="20" y="120"><tspan fill="#7ee2b0">$</tspan><tspan fill="#e6e9ee"> stage0 --ir proben-ir/readme-counter-unlocked.gab bad.img   </tspan><tspan fill="#6b7682"># bump() outside locks L</tspan></text>
    <text x="20" y="141" fill="#ff7b72">stage0: call without held guard</text>
    <text x="20" y="162" fill="#8b95a1">stage0: note: elaboration: function main: call without held guard (statement 1 of 2: call bump) [declared at</text>
    <text x="20" y="183" fill="#8b95a1">proben-ir/readme-counter-unlocked.gab:17] [statement at proben-ir/readme-counter-unlocked.gab:20]</text>
    <text x="20" y="218"><tspan fill="#7ee2b0">$</tspan><tspan fill="#e6e9ee"> stage0 --ir proben-ir/readme-counter-overflow.gab bad.img   </tspan><tspan fill="#6b7682"># if c &lt;= 100: c + 1 may be 101</tspan></text>
    <text x="20" y="239" fill="#ff7b72">stage0: value outside range</text>
    <text x="20" y="260" fill="#8b95a1">stage0: note: function bump: value outside range [declared at proben-ir/readme-counter-overflow.gab:7]</text>
    <text x="20" y="300"><tspan fill="#7ee2b0">$</tspan><tspan fill="#e6e9ee"> </tspan><tspan fill="#e6e9ee" opacity="0.7">▌</tspan></text>
  </g>
</svg>
