version = 1

[backends.claude]
binary = "claude"
candidate_version = "2.1.286"
kind = "claude"
native_delegation = false
transport = "stream-json"

[backends.codex]
binary = "codex"
candidate_version = "0.160.0"
kind = "codex"
native_delegation = false
transport = "stdio"

[backends.opencode]
binary = "opencode"
candidate_version = "1.18.34"
hostname = "127.0.0.1"
kind = "opencode"
native_delegation = false

[build.queues.lean]
match = [
    "lake build",
    "lake build *",
    "lake env lean *",
    "lean *",
]
max_parallel = 1
timeout = "1h"

[build.queues.rust]
match = [
    "cargo build",
    "cargo build *",
    "cargo test",
    "cargo test *",
    "cargo clippy",
    "cargo clippy *",
]
max_parallel = 2
timeout = "45m"

[[checks.required]]
command = [
    "cargo",
    "test",
    "--manifest-path",
    "instrumente/silicon-harness/Cargo.toml",
]
id = "silicon-harness-selftest"

[merge]
cleanup_worktrees = true
strategy = "merge-commit"
target_branch = "master"

[observation]
debounce = "500ms"
ignore = [
    ".git",
    ".town/",
    "target/",
    "node_modules/",
    "dist/",
    "build/",
]
reconcile_every = "30s"

[permissions.files]
decision_timeout = "2m"
max_scope = "project"
root_policy = "project-bounds"
route = "supervisor"
timeout_action = "deny"
unmatched = "deny"

[profiles.coordinator]
can_decide_child_files = true
file_access = "read"
shell = "deny"
task_permissions = [
    "read_all",
    "create",
    "assign",
    "update_own",
    "merge_owned",
]

[profiles.reader]
file_access = "read"
shell = "deny"
task_permissions = [
    "read_own",
    "update_own",
]

[profiles.reviewer]
file_access = "write"
shell = "ask"
shell_allow = [
    "git status *",
    "git diff *",
    "git add *",
    "git commit *",
    "cargo fmt *",
    "cargo test *",
    "cargo clippy *",
    "cargo *",
    "lake *",
    "lean *",
    "ls *",
    "mkdir *",
    "cp *",
    "./lean-bau *",
    "./lean-probe *",
    "./target/*",
    "./instrumente/*",
]
task_permissions = [
    "read_own",
    "update_own",
    "review_assigned",
]

[profiles.worker]
file_access = "write"
shell = "ask"
shell_allow = [
    "git status *",
    "git diff *",
    "git add *",
    "git commit *",
    "cargo fmt *",
    "cargo test *",
    "cargo clippy *",
    "cargo *",
    "lake *",
    "lean *",
    "ls *",
    "mkdir *",
    "cp *",
    "./lean-bau *",
    "./lean-probe *",
    "./target/*",
    "./instrumente/*",
]
task_permissions = [
    "read_own",
    "update_own",
]

[project]
name = "Gabbro"
repository = ".."
state_dir = ".town"

[review]
active_time_budget = "45m"
max_repair_rounds = 3
repair = true
require_different_agent = true
role = "reviewer"

[roles.coordinator]
backend = "opencode"
default_model = "opencode-go/muse-spark-1.3-contributor"
instances = 1
profile = "coordinator"
prompt = "roles/coordinator.md"

[roles.coordinator.models]
"opencode-go/muse-spark-1.3-contributor" = 1

[[roles.coordinator.watch]]
event = "task.ready"
id = "completion"

[roles.coordinator.watch.source]
roles = ["worker"]

[[roles.coordinator.watch]]
after = "2h"
event = "agent.no_edits"
id = "worker-no-edits"
states = ["working"]

[roles.coordinator.watch.source]
roles = ["worker"]

[[roles.coordinator.watch]]
event = "task.blocked"
id = "blocked"

[roles.coordinator.watch.source]
roles = [
    "worker",
    "reviewer",
]

[[roles.coordinator.watch]]
event = "task.failed"
id = "failed"

[roles.coordinator.watch.source]
roles = [
    "worker",
    "reviewer",
]

[roles.human-interface]
backend = "opencode"
default_model = "opencode-go/muse-spark-1.3-contributor"
instances = 1
profile = "reader"
prompt = "roles/human-interface.md"
supervisor_role = "coordinator"

[roles.human-interface.models]
"opencode-go/muse-spark-1.3-contributor" = 1

[[roles.human-interface.watch]]
event = "task.ready"
id = "completion"

[roles.human-interface.watch.source]
roles = [
    "worker",
    "coordinator",
]

[[roles.human-interface.watch]]
event = "task.merged"
id = "merged"

[roles.human-interface.watch.source]
all = true

[[roles.human-interface.watch]]
event = "task.cleanup_completed"
id = "cleaned"

[roles.human-interface.watch.source]
all = true

[[roles.human-interface.watch]]
event = "task.failed"
id = "failures"

[roles.human-interface.watch.source]
all = true

[[roles.human-interface.watch]]
event = "task.blocked"
id = "blocked"

[roles.human-interface.watch.source]
all = true

[[roles.human-interface.watch]]
event = "agent.unavailable"
id = "backend-down"

[roles.human-interface.watch.source]
all = true

[[roles.human-interface.watch]]
after = "2h"
event = "agent.no_edits"
id = "worker-no-edits"
states = ["working"]

[roles.human-interface.watch.source]
roles = ["worker"]

[roles.reviewer]
backend = "opencode"
default_model = "opencode-go/muse-spark-1.3-contributor"
instances = 1
profile = "reviewer"
prompt = "roles/reviewer.md"
supervisor_role = "coordinator"

[roles.reviewer.models]
"opencode-go/muse-spark-1.3-contributor" = 1

[roles.worker]
backend = "opencode"
default_model = "opencode/nemotron-3-ultra-free"
instances = 1
profile = "worker"
prompt = "roles/worker.md"
supervisor_role = "coordinator"

[roles.worker.models]
"opencode/nemotron-3-ultra-free" = 1

[runtime]
delivery_max_attempts = 5
delivery_retry_initial = "5s"
delivery_retry_max = "5m"
human_reserved_turns = 1
max_active_turns = 4
max_agents = 6
max_batch_messages = 16
max_message_bytes = 32768
max_unacknowledged_deliveries = 10000

[ui]
entry_role = "human-interface"
kind = "tmux"
session = "town-a9fadcfa7cbf"

[workspace]
base_ref = "HEAD"
strategy = "git-worktree"
