name = "bruecke"
version = "0.1.0"
defaultTargets = ["Bruecke"]

# The bridge between the goal theorem (`grammatik/`, machine G) and GabbroV (`programmlogik/`,
# `Gabbro.Body`), on the toolchain of `grammatik` and `programmlogik` (v4.35.0). Mathlib comes in
# only through `grammatik`; the packages are shared with `grammatik/.lake/packages` (as `stage0/`).
# `Gabbro/Body.lean` and the generated `Duty/`+`Proofs/` files import nothing but `Gabbro.Body`
# (measured 2026-09-29). Nothing is copied: `srcDir` points at the original files.

[[require]]
name = "grammatik"
path = "../grammatik"

[[lean_lib]]
name = "Gabbro"
srcDir = "../programmlogik"
roots = ["Gabbro.Body"]

# The generated duty files of the units the bridge covers -- compiled in place, proofs included.
[[lean_lib]]
name = "Duty"
srcDir = "../programmlogik"
roots = ["Duty.Duty104Referenz", "Duty.Duty108DisjointStartLocks", "Duty.Duty130DerivedContractPure", "Duty.Duty69IntegerConversion", "Duty.Duty73SugarWidths"]

[[lean_lib]]
name = "Bruecke"
